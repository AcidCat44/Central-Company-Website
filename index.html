  <body> 
    <h1>Central Company Website</h1>
        <!-- The hidden audio player -->
<audio id="bg-music" autoplay loop muted>
  <source src="Music.mp3" type="audio/mpeg" />
  <source src="Music.ogg" type="audio/ogg" />
</audio>

<!-- Styled control button stuck to the top-right corner -->
<button id="audio-toggle" class="corner-btn">🔊 Unmute</button>

<style>
  .corner-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999; /* Keeps it on top of all other elements */
    padding: 10px 15px;
    background-color: #333;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.2s ease;
  }

  .corner-btn:hover {
    background-color: #555;
  }
</style>

<script>
  const music = document.getElementById('bg-music');
  const button = document.getElementById('audio-toggle');

  button.addEventListener('click', () => {
    if (music.muted) {
      music.muted = false;
      music.currentTime = 0; // Rewinds track to 0:00
      music.play(); 
      button.textContent = '⏸️ Mute';
    } else {
      music.muted = true;
      button.textContent = '🔊 Unmute';
    }
  });
</script>
